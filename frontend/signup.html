<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Restaurant Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-sm">
    <div class="card">
      <div class="auth-header">
        <div class="brand-icon">🍽️</div>
        <h1>Create Account</h1>
        <p>Join the restaurant management system</p>
      </div>

      <div class="alert alert-error"   id="errorMsg"></div>
      <div class="alert alert-success" id="successMsg"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="John Doe"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="john@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="08012345678"
            required
            maxlength="11"
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Min 6 chars, include A-Z, 0-9 and symbol"
            required
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          Create Account
        </button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    const form       = document.getElementById('signupForm');
    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn  = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const phone    = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role     = document.getElementById('role').value;

      if (!name || !email || !phone || !password) {
        showError('Please fill in all fields.');
        return;
      }
      if (phone.length !== 11) {
        showError('Phone number must be exactly 11 digits.');
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const res  = await fetch('http://localhost:5100/api/users/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ name, email, phone, password, role }),
        });
        const data = await res.json();

        if (!res.ok) {
          // Show validation issues or server error
          const detail = data.errors
            ? data.errors.map(err => err.message).join(', ')
            : (data.message || 'Registration failed.');
          showError(detail);
          return;
        }

        successMsg.textContent = 'Account created! Redirecting to login…';
        successMsg.classList.add('show');
        form.reset();

        setTimeout(() => { window.location.href = 'login.html'; }, 1800);

      } catch (err) {
        showError('Could not reach the server. Make sure the backend is running.');
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
  </script>

</body>
</html>
