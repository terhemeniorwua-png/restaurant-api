<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Restaurant Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">🍽️ <span>Restaurant</span> Manager</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="menu.html">Menu</a>
      <a href="create-order.html">New Order</a>
      <a href="orders.html" class="active">Orders</a>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="page">

    <div class="page-heading">
      <h2>🧾 All Orders</h2>
      <a href="create-order.html" class="btn btn-primary">+ New Order</a>
    </div>

    <div class="alert alert-error"   id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>

    <!-- Status filter -->
    <div class="filter-bar" id="statusFilter">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="pending">Pending</button>
      <button class="filter-btn" data-status="confirmed">Confirmed</button>
      <button class="filter-btn" data-status="preparing">Preparing</button>
      <button class="filter-btn" data-status="ready">Ready</button>
      <button class="filter-btn" data-status="delivered">Delivered</button>
      <button class="filter-btn" data-status="cancelled">Cancelled</button>
    </div>

    <div class="table-wrap">
      <table class="orders-table" id="ordersTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Status update modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal">
      <h3>Update Order Status</h3>
      <p style="margin-bottom:.8rem;">Order <strong id="modalOrderId"></strong></p>
      <div class="form-group">
        <select id="statusSelect">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="preparing">Preparing</option>
          <option value="ready">Ready</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="confirmStatusBtn">Update</button>
        <button class="btn btn-outline" id="cancelStatusBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete order modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete Order?</h3>
      <p id="deleteModalText">This will permanently remove the order and all its items.</p>
      <div class="modal-actions">
        <button class="btn btn-danger"  id="confirmDeleteBtn">Yes, Delete</button>
        <button class="btn btn-outline" id="cancelDeleteBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const ordersBody = document.getElementById('ordersBody');
    const statusFilter = document.getElementById('statusFilter');

    let allOrders       = [];
    let activeStatus    = '';
    let statusTargetId  = null;
    let deleteTargetId  = null;

    // ── Load orders ──────────────────────────────────────────────────
    async function loadOrders() {
      ordersBody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">Loading…</td></tr>';
      try {
        const res  = await fetch('http://localhost:5100/api/orders', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Failed to load orders.');
          ordersBody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--danger);">Failed to load.</td></tr>';
          return;
        }

        allOrders = data.data;
        renderOrders(allOrders);

      } catch {
        showError('Could not reach the server. Make sure the backend is running.');
        ordersBody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--danger);">Server unreachable.</td></tr>';
      }
    }

    // ── Render orders table ──────────────────────────────────────────
    function renderOrders(orders) {
      const filtered = activeStatus
        ? orders.filter(o => o.status === activeStatus)
        : orders;

      if (filtered.length === 0) {
        ordersBody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">No orders found.</td></tr>';
        return;
      }

      ordersBody.innerHTML = filtered.map(order => {
        const customerName = order.user ? escHtml(order.user.name) : '<span style="color:var(--muted)">Guest</span>';

        const itemsList = order.orderItems && order.orderItems.length
          ? order.orderItems.map(i =>
              `${escHtml(i.menuItem ? i.menuItem.name : '?')} ×${i.quantity}`
            ).join('<br>')
          : '<span style="color:var(--muted);">—</span>';

        const total = `₦${Number(order.total_price).toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;
        const date  = new Date(order.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

        return `
          <tr id="row-${order.id}">
            <td><strong>#${order.id}</strong></td>
            <td>${customerName}</td>
            <td class="item-list">${itemsList}</td>
            <td style="font-weight:700;color:var(--brand);">${total}</td>
            <td><span class="badge badge-${order.status}">${order.status}</span></td>
            <td style="color:var(--muted);font-size:.82rem;">${order.notes ? escHtml(order.notes) : '—'}</td>
            <td style="font-size:.82rem;white-space:nowrap;">${date}</td>
            <td>
              <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
                <button class="btn btn-info btn-sm"
                        onclick="openStatusModal(${order.id}, '${order.status}')"
                        title="Update status">📋 Status</button>
                <button class="btn btn-danger btn-sm"
                        onclick="openDeleteModal(${order.id})"
                        title="Delete order">🗑️ Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // ── Status filter ────────────────────────────────────────────────
    statusFilter.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeStatus = btn.dataset.status;
      renderOrders(allOrders);
    });

    // ── Status modal ─────────────────────────────────────────────────
    const statusModal      = document.getElementById('statusModal');
    const modalOrderId     = document.getElementById('modalOrderId');
    const statusSelect     = document.getElementById('statusSelect');
    const confirmStatusBtn = document.getElementById('confirmStatusBtn');
    const cancelStatusBtn  = document.getElementById('cancelStatusBtn');

    function openStatusModal(id, currentStatus) {
      statusTargetId         = id;
      modalOrderId.textContent = `#${id}`;
      statusSelect.value     = currentStatus;
      statusModal.classList.add('show');
    }

    cancelStatusBtn.addEventListener('click', () => {
      statusModal.classList.remove('show');
      statusTargetId = null;
    });

    confirmStatusBtn.addEventListener('click', async () => {
      if (!statusTargetId) return;
      statusModal.classList.remove('show');
      confirmStatusBtn.disabled = true;

      try {
        const res  = await fetch(`http://localhost:5100/api/orders/${statusTargetId}`, {
          method:  'PATCH',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ status: statusSelect.value }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Failed to update status.');
        } else {
          showSuccess(`Order #${statusTargetId} status updated to "${statusSelect.value}".`);
          // Update in-memory and re-render
          const idx = allOrders.findIndex(o => o.id === statusTargetId);
          if (idx !== -1) allOrders[idx].status = statusSelect.value;
          renderOrders(allOrders);
        }
      } catch {
        showError('Could not reach the server.');
      } finally {
        confirmStatusBtn.disabled = false;
        statusTargetId = null;
      }
    });

    // ── Delete modal ─────────────────────────────────────────────────
    const deleteModal      = document.getElementById('deleteModal');
    const deleteModalText  = document.getElementById('deleteModalText');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
    const cancelDeleteBtn  = document.getElementById('cancelDeleteBtn');

    function openDeleteModal(id) {
      deleteTargetId = id;
      deleteModalText.textContent = `Delete Order #${id}? This will permanently remove the order and all its items.`;
      deleteModal.classList.add('show');
    }

    cancelDeleteBtn.addEventListener('click', () => {
      deleteModal.classList.remove('show');
      deleteTargetId = null;
    });

    confirmDeleteBtn.addEventListener('click', async () => {
      if (!deleteTargetId) return;
      deleteModal.classList.remove('show');
      confirmDeleteBtn.disabled = true;

      try {
        const res  = await fetch(`http://localhost:5100/api/orders/${deleteTargetId}`, {
          method:  'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Delete failed.');
        } else {
          showSuccess(`Order #${deleteTargetId} deleted.`);
          allOrders = allOrders.filter(o => o.id !== deleteTargetId);
          renderOrders(allOrders);
        }
      } catch {
        showError('Could not reach the server.');
      } finally {
        confirmDeleteBtn.disabled = false;
        deleteTargetId = null;
      }
    });

    // ── Helpers ──────────────────────────────────────────────────────
    function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function showError(msg)   { errorMsg.textContent   = msg; errorMsg.classList.add('show');   successMsg.classList.remove('show'); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }

    // ── Init ─────────────────────────────────────────────────────────
    loadOrders();
  </script>

</body>
</html>
