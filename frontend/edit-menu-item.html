<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Menu Item — Restaurant Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">🍽️ <span>Restaurant</span> Manager</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="create-order.html">New Order</a>
      <a href="orders.html">Orders</a>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="page" style="max-width:600px;">

    <div class="page-heading">
      <h2 id="pageTitle">✏️ Add Menu Item</h2>
      <a href="menu.html" class="btn btn-outline">← Back to Menu</a>
    </div>

    <div class="card">
      <div class="alert alert-error"   id="errorMsg"></div>
      <div class="alert alert-success" id="successMsg"></div>

      <form id="menuItemForm" novalidate>

        <div class="form-group">
          <label for="name">Item Name <span style="color:var(--danger)">*</span></label>
          <input type="text" id="name" name="name" placeholder="e.g. Classic Beef Burger" required />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Short description of the item…"></textarea>
        </div>

        <div class="form-group">
          <label for="price">Price (₦) <span style="color:var(--danger)">*</span></label>
          <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g. 2500" required />
        </div>

        <div class="form-group">
          <label for="category_id">Category <span style="color:var(--danger)">*</span></label>
          <select id="category_id" name="category_id" required>
            <option value="">— Select a category —</option>
          </select>
        </div>

        <div class="form-group">
          <label for="is_available" style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input type="checkbox" id="is_available" name="is_available"
                   style="width:auto;accent-color:var(--brand);" checked />
            Available for ordering
          </label>
        </div>

        <div style="display:flex;gap:.8rem;margin-top:1.2rem;">
          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            Save Item
          </button>
          <a href="menu.html" class="btn btn-outline btn-full">Cancel</a>
        </div>

      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const params     = new URLSearchParams(window.location.search);
    const editId     = params.get('id');    // null = create mode
    const isEdit     = !!editId;

    const pageTitle  = document.getElementById('pageTitle');
    const submitBtn  = document.getElementById('submitBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const catSelect  = document.getElementById('category_id');

    if (isEdit) {
      pageTitle.textContent = '✏️ Edit Menu Item';
      submitBtn.textContent = 'Update Item';
    }

    // ── Load categories into <select> ────────────────────────────────
    async function loadCategories() {
      try {
        const res  = await fetch('http://localhost:5100/api/categories');
        const data = await res.json();
        if (!res.ok) return;

        data.data.forEach(cat => {
          const opt     = document.createElement('option');
          opt.value     = cat.id;
          opt.textContent = cat.name;
          catSelect.appendChild(opt);
        });
      } catch { /* silently ignore */ }
    }

    // ── If editing, pre-fill form with existing data ─────────────────
    async function loadItemData() {
      if (!isEdit) return;
      try {
        const res  = await fetch(`http://localhost:5100/api/menu-items/${editId}`);
        const data = await res.json();

        if (!res.ok) {
          showError('Item not found.');
          return;
        }

        const item = data.data;
        document.getElementById('name').value         = item.name;
        document.getElementById('description').value  = item.description || '';
        document.getElementById('price').value        = item.price;
        document.getElementById('category_id').value  = item.category_id;
        document.getElementById('is_available').checked = item.is_available;

      } catch {
        showError('Could not load item data.');
      }
    }

    // ── Form submit: create or update ────────────────────────────────
    document.getElementById('menuItemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');

      const name        = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const price       = document.getElementById('price').value;
      const category_id = document.getElementById('category_id').value;
      const is_available = document.getElementById('is_available').checked;

      if (!name)        { showError('Item name is required.');    return; }
      if (!price)       { showError('Price is required.');        return; }
      if (!category_id) { showError('Please select a category.'); return; }
      if (Number(price) < 0) { showError('Price cannot be negative.'); return; }

      submitBtn.disabled    = true;
      submitBtn.textContent = isEdit ? 'Updating…' : 'Saving…';

      const body = { name, description, price: Number(price), category_id: Number(category_id), is_available };
      const url    = isEdit
        ? `http://localhost:5100/api/menu-items/${editId}`
        : 'http://localhost:5100/api/menu-items';
      const method = isEdit ? 'PATCH' : 'POST';

      try {
        const res  = await fetch(url, {
          method,
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Failed to save item.');
          return;
        }

        showSuccess(isEdit ? 'Item updated successfully!' : 'Item created successfully!');

        if (!isEdit) {
          document.getElementById('menuItemForm').reset();
          catSelect.value = '';
        }

        setTimeout(() => { window.location.href = 'menu.html'; }, 1400);

      } catch {
        showError('Could not reach the server.');
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = isEdit ? 'Update Item' : 'Save Item';
      }
    });

    function showError(msg)   { errorMsg.textContent   = msg; errorMsg.classList.add('show');   successMsg.classList.remove('show'); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }

    // ── Init ─────────────────────────────────────────────────────────
    (async () => {
      await loadCategories();
      await loadItemData();
    })();
  </script>

</body>
</html>
